name: station3-paths

# Station 3: muscle paths (station3/GATES.md) on a clean Linux machine, plus the harness self-test.
# Runs the full pipeline on both gait models and checks gates M0-M1 against the committed MyoConverter column
# (station3/<model>/baseline_myoconverter.json, computed once in MuJoCo 2.3.7).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "env/**"
      - "station2/**"
      - "station3/**"
      - ".github/workflows/station3-paths.yml"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for VTK (mesh conversion)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libxext6
      - name: Install the locked environment
        run: python -m pip install --require-hashes -r env/requirements.lock
      - name: Clone upstream MyoConverter at the pinned commit (gait models)
        run: |
          git clone --quiet https://github.com/MyoHub/myoconverter.git upstream
          git -C upstream checkout --quiet cadf38059367a51239e6dc28c9fbe8b8fbd5149f
      - name: Harness self-test (mutations must fail, analytic moment arms must agree)
        run: python station3/tests/test_paths_harness.py upstream/models/osim/Gait10dof18musc/gait10dof18musc.osim ../s3_scratch
      - name: Station 3 gates, both gait models
        run: bash station3/run_station3.sh ci upstream ../s3_work python
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station3-linux-results
          path: |
            station3/*/ci.json
            station3/*/ci_m1.json
          if-no-files-found: warn
