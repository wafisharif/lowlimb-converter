name: station5-walking

# Station 5: walking (station5/GATES.md) on a clean Linux machine, plus the harness self-test and the test of
# conditional path points that switch through a helper joint (change 5.3). Runs the full pipeline on both gait models
# and checks gates W0-W3 against the committed MyoConverter column (station5/<model>/baseline_myoconverter.json,
# computed once in MuJoCo 2.3.7); level 3 (forward replay) is reported in the uploaded results, never gated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "env/**"
      - "lowlimb_converter/checks/**"
      - "station5/**"
      - ".github/workflows/station5-walking.yml"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for VTK (mesh conversion)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libxext6
      - name: Install the locked environment
        run: python -m pip install --require-hashes -r env/requirements.lock
      - name: Clone upstream MyoConverter at the pinned commit (gait models)
        run: |
          git clone --quiet https://github.com/MyoHub/myoconverter.git upstream
          git -C upstream checkout --quiet cadf38059367a51239e6dc28c9fbe8b8fbd5149f
      - name: Clone opensim-models at the pinned commit (walking data of both gait pipelines only)
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/opensim-org/opensim-models.git ../opensim-models
          git -C ../opensim-models sparse-checkout set Pipelines/Gait10dof18musc Pipelines/Gait2354_Simbody
          git -C ../opensim-models checkout --quiet d9b05d470b1a481c222372c85b75772faf8f7792
      - name: Conditional path points that switch through a helper joint (change 5.3)
        run: |
          G=upstream/models/osim/Gait2354Simbody
          python station5/tests/test_switch_point.py src $G/gait2354.osim $G/Geometry ../s5_scratch/switch
      - name: Station 5 gates, both gait models
        run: bash station5/run_station5.sh ci upstream ../opensim-models ../s5_work python
      - name: Harness self-test (OpenSim's own ID tool, independent cross-check, mutations)
        run: |
          python station5/tests/test_gait_harness.py upstream/models/osim/Gait10dof18musc/gait10dof18musc.osim \
            ../opensim-models ../s5_work/ci/gait10dof18musc/gait10dof18musc_cvt3.xml ../s5_scratch/harness
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station5-linux-results
          path: |
            station5/*/ci.json
            station5/*/ci_w.json
            station5/*/ci_replay*.json
          if-no-files-found: warn
