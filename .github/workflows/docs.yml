name: docs

# Builds the documentation (docs/) exactly as Read the Docs does, with warnings as errors, so a broken page or link
# target fails here first.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "osim2mujoco/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the documentation requirements
        run: python -m pip install -r docs/requirements.txt
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
