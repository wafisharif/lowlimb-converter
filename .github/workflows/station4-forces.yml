name: station4-forces

# Station 4: muscle forces (station4/GATES.md) on a clean Linux machine, plus the harness self-test and the
# gravity / torque-actuator test (changes 1c.1-1c.2). Runs the full pipeline on both gait models and checks gates
# F0-F2 against the committed MyoConverter column (station4/<model>/baseline_myoconverter.json, computed once in
# MuJoCo 2.3.7).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "env/**"
      - "station2/**"
      - "station3/**"
      - "station4/**"
      - "station1/tests/test_gravity_actuators.py"
      - ".github/workflows/station4-forces.yml"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for VTK (mesh conversion)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libxext6
      - name: Install the locked environment
        run: python -m pip install --require-hashes -r env/requirements.lock
      - name: Clone upstream MyoConverter at the pinned commit (gait models)
        run: |
          git clone --quiet https://github.com/MyoHub/myoconverter.git upstream
          git -C upstream checkout --quiet cadf38059367a51239e6dc28c9fbe8b8fbd5149f
      - name: Harness self-test (mutations must fail, forces must equal MuJoCo's own muscle functions)
        run: python station4/tests/test_forces_harness.py upstream/models/osim/Gait10dof18musc/gait10dof18musc.osim ../s4_scratch
      - name: Gravity and torque actuators match OpenSim (changes 1c.1-1c.2)
        run: |
          G=upstream/models/osim/Gait10dof18musc
          python station1/tests/test_gravity_actuators.py src $G/gait10dof18musc.osim $G/Geometry ../s1c_scratch
      - name: Station 4 gates, both gait models
        run: bash station4/run_station4.sh ci upstream ../s4_work python
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station4-linux-results
          path: |
            station4/*/ci.json
            station4/*/ci_f.json
          if-no-files-found: warn
